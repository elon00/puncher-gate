name: Offline STUN Parser Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: '1.99.1'
          components: rustfmt
      - name: Fail closed on invalid Python syntax
        run: python -m compileall -q src tests
      - name: Run implementation-coupled offline STUN parser tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust diagnostic formatting and frozen offline build
        run: |
          cargo fmt --all -- --check
          cargo test --frozen --offline --all-targets
