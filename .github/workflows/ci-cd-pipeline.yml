name: Offline STUN Parser Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on invalid Python syntax
        run: python -m compileall -q src tests
      - name: Run implementation-coupled offline STUN parser tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust formatting and build verification (diagnostic only)
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets
